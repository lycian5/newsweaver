<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COA NEWS 리서치 브리프</title>
  <style>
    :root{font-family:Arial,"Noto Sans KR",sans-serif;color:#18212a;background:#f4f7f8;--blue:#087ea4;--line:#d8e1e5;--muted:#65747d;--good:#087a43;--warn:#a15c00;--bad:#b42318}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}
    .top{background:var(--blue);color:#fff;padding:16px 24px}
    .top-in,.wrap{max-width:1320px;margin-left:auto;margin-right:auto}
    .top-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .top h1{font-size:21px;margin:0}.top p{font-size:13px;margin:5px 0 0;color:#d9f4fb}
    .nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .nav a,.nav button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;padding:8px 11px;border-radius:6px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}
    .nav a.active{background:#fff;color:var(--blue);border-color:#fff}
    .wrap{padding:16px}
    .work{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
    .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left}
    .card.active{outline:2px solid var(--blue)}
    .card.ready{background:#e8f6ee}
    .card strong{display:block;color:var(--blue);font-size:22px}
    .card span{font-size:12px;color:var(--muted)}
    .hint{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
    .workspace{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:9px;min-width:0}
    .queue-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
    .queue-head h2,.detail h2{margin:0}
    .list{min-height:520px;max-height:calc(100vh - 280px);overflow:auto}
    .item{display:block;width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:14px;text-align:left}
    .item.active,.item:hover{background:#edf8fb}
    .item strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.42}
    .blurb{margin:6px 0 0;color:#4e5d66;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .item-meta,.item-bottom,.eyebrow,.article-meta,.history,.cta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .item-meta{margin-top:7px;color:var(--muted);font-size:12px}
    .item-bottom{margin-top:8px}
    .badge{display:inline-flex;font-size:11px;padding:3px 7px;border-radius:4px;background:#edf2f4}
    .badge.good{background:#e8f6ee;color:var(--good)}.badge.warn{background:#fff4dc;color:var(--warn)}.badge.bad{background:#fff0ee;color:var(--bad)}.badge.blue{background:#e5f4f9;color:#075f7d}
    .detail{padding:22px;min-height:620px}
    .detail h2{font-size:24px;line-height:1.38;margin:8px 0 10px}
    .verdict{border:1px solid #b7e4c7;background:#e8f6ee;border-radius:7px;padding:13px;margin:8px 0 14px}
    .verdict.reviewable{border-color:#f3d399;background:#fff4dc}
    .verdict.blocked{border-color:#fecaca;background:#fff6f5}
    .verdict h3{margin:0 0 6px;font-size:15px}
    .summary{font-size:15px;line-height:1.7;margin:0 0 14px}
    .digest{width:100%;border-collapse:collapse;font-size:13px}
    .digest th,.digest td{border-top:1px solid #e5edf0;padding:9px 8px;text-align:left;vertical-align:top}
    .digest th{width:72px;color:#075f7d;font-size:12px}
    .digest td small{display:block;color:var(--muted);margin-top:3px}
    .cta{margin-bottom:8px}
    .btn{border:0;border-radius:6px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center}
    .btn.secondary{background:#fff;color:#24313a;border:1px solid #b9c8cf}
    .btn.danger{color:var(--bad);border-color:#fecaca;background:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .detail-section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
    .detail-section h3{font-size:15px;margin:0 0 10px}
    .judgment{display:grid;gap:8px;line-height:1.55;font-size:14px}
    .validation{border:1px solid #bae6fd;background:#f0f9ff;border-radius:7px;padding:13px}
    .validation.blocked{border-color:#fecaca;background:#fff6f5}
    .checks{padding:0;margin:0;list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
    .checks li{font-size:12px}.checks li::before{content:'●';margin-right:6px}
    .pass::before{color:var(--good)}.warn::before{color:#d88900}.fail::before{color:var(--bad)}
    .guidance{font-size:12px;color:var(--warn);margin:11px 0 0}
    .fact-group{border:1px solid #e5edf0;border-radius:7px;padding:11px;margin-top:9px}
    .fact-group h4{color:#075f7d;font-size:12px;margin:0 0 7px}
    .fact{font-size:13px;padding:8px 0;border-top:1px solid #edf1f2}.fact:first-of-type{border-top:0}
    .fact small{margin-left:5px;color:var(--muted)}
    .article{padding:13px 0;border-top:1px solid #edf1f2}.article:first-child{border-top:0}
    .article a{color:#12688a;text-decoration:none}
    .article p{font-size:13px;color:#4e5d66;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .history{gap:18px;color:var(--muted);font-size:12px}.history strong{display:block;color:#24313a;margin-bottom:3px}
    .muted,.queue-head span{color:var(--muted);font-size:12px}
    .more{margin-top:12px}.more summary{cursor:pointer;color:var(--muted);font-size:13px}
    .filters{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0;padding:0 16px 16px}
    details.more[open] .filters{display:grid}
    .filters input,.filters select{border:1px solid #b9c8cf;border-radius:6px;padding:9px;background:#fff;width:100%}
    .overflow{position:relative}.overflow summary{list-style:none}.overflow summary::-webkit-details-marker{display:none}
    .overflow>div{position:absolute;left:0;bottom:42px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:7px}
    .empty,.loading{padding:48px 20px;text-align:center;color:var(--muted)}
    .mobile-back{display:none}
    .toast{position:fixed;right:18px;bottom:18px;z-index:9;background:#18212a;color:#fff;padding:11px 14px;border-radius:7px}
    .toast.error{background:var(--bad)}.is-hidden{display:none}
    @media(max-width:980px){.work{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:300px minmax(0,1fr)}}
    @media(max-width:700px){
      .top{padding:16px}.top-in{display:block}.nav{margin-top:12px}
      .work{grid-template-columns:1fr 1fr}
      .workspace{display:block}
      .detail-panel{display:none}.workspace.has-detail .queue-panel{display:none}.workspace.has-detail .detail-panel{display:block}
      .list{max-height:none;min-height:480px}.detail{padding:18px}.detail h2{font-size:20px}
      .mobile-back{display:inline-flex;margin-bottom:13px}.checks{grid-template-columns:1fr}
      .filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div>
        <h1>리서치 브리프</h1>
        <p>오늘 쓸 소재를 먼저 고르고, 검증된 것만 초안으로 넘깁니다.</p>
      </div>
      <nav class="nav">
        <a href="/vps-collector">수집 운영</a>
        <a class="active" href="/research-briefs">리서치 브리프</a>
        <a href="/coanews-draft">기사 초안</a>
        <button id="refresh" type="button">새로고침</button>
        <button id="logout" type="button">로그아웃</button>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <section class="work">
      <button class="card ready" data-quick="ready" type="button"><strong id="metricReady">0</strong><span>지금 작성 가능</span></button>
      <button class="card" data-quick="needs" type="button"><strong id="metricNeeds">0</strong><span>작성 보류</span></button>
      <button class="card" data-quick="held" type="button"><strong id="metricHeld">0</strong><span>보류</span></button>
      <a class="card" id="collectionCard" href="/vps-collector"><strong id="collectionStatus">수집 확인</strong><span id="collectionMeta">운영 화면에서 상태 확인</span></a>
    </section>
    <p class="hint" id="queueHint">기본 큐는 오늘 작성 가능한 소재입니다. 필터는 필요할 때만 엽니다.</p>
    <main class="workspace" id="workspace">
      <section class="panel queue-panel">
        <div class="queue-head"><h2 id="queueTitle">오늘 할 일</h2><span id="queueCount">0건</span></div>
        <div class="list" id="list"><div class="loading">브리프를 불러오는 중입니다.</div></div>
        <details class="more">
          <summary>필터 더 보기</summary>
          <section class="filters">
            <input id="search" type="search" placeholder="제목 검색" autocomplete="off" />
            <select id="category">
              <option value="">전체 분야</option>
              <option value="ai_business">AI 비즈니스</option>
              <option value="startup">창업·부업</option>
              <option value="policy">정책·지원사업</option>
              <option value="small_business_economy">소상공인 경제</option>
              <option value="local_commerce">지역 상권</option>
              <option value="marketing_distribution">마케팅·유통</option>
              <option value="field_issue">현장 이슈</option>
            </select>
            <select id="freshness">
              <option value="24h">최근 24시간</option>
              <option value="7d">최근 7일</option>
              <option value="30d">최근 30일</option>
              <option value="all">전체 기간</option>
            </select>
            <select id="sourceLayer">
              <option value="">전체 출처</option>
              <option value="official">공식 출처 포함</option>
              <option value="data">데이터 출처 포함</option>
              <option value="signal">신호 출처 포함</option>
            </select>
            <select id="editorialState">
              <option value="">전체 상태</option>
              <option value="unreviewed">미검토</option>
              <option value="reviewing">검토 중</option>
              <option value="held">보류</option>
              <option value="prepared">초안 전환</option>
            </select>
            <select id="sort">
              <option value="attention">선별 우선</option>
              <option value="latest">최신순</option>
              <option value="quality">품질순</option>
              <option value="official">공식 출처순</option>
            </select>
          </section>
        </details>
      </section>
      <section class="panel detail-panel" id="detail"><div class="empty">왼쪽에서 브리프를 선택하세요.</div></section>
    </main>
  </div>
  <div class="toast is-hidden" id="toast" role="status"></div>
  <script src="/auth-session.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const filters = ['search','category','freshness','sourceLayer','editorialState','sort'];
    let briefs = [], selectedId = null, selectedBrief = null, showAllSources = false, loadSequence = 0, quick = 'ready';
    restoreFilters();
    $('refresh').onclick = () => loadBriefs(true);
    $('logout').onclick = CoaAuth.logout;
    filters.forEach((id) => $(id).addEventListener(id === 'search' ? 'input' : 'change', debounce(() => loadBriefs(false), id === 'search' ? 250 : 0)));
    document.querySelectorAll('[data-quick]').forEach((button) => button.onclick = () => { quick = button.dataset.quick; applyQuickFilter(); });
    function restoreFilters(){
      const query = new URLSearchParams(location.search);
      const defaults = { freshness:'24h', editorialState:'', sort:'attention' };
      filters.forEach((id) => { $(id).value = query.get(id) ?? defaults[id] ?? ''; });
      selectedId = Number(query.get('id')) || null;
      quick = query.get('quick') || 'ready';
    }
    function currentQuery(){
      const query = new URLSearchParams();
      filters.forEach((id) => { if ($(id).value) query.set(id, $(id).value); });
      if (quick) query.set('quick', quick);
      if (selectedId) query.set('id', selectedId);
      return query;
    }
    function syncUrl(){ history.replaceState(null, '', `${location.pathname}?${currentQuery().toString()}`); }
    function queueLabel(){ return { ready:'오늘 할 일', needs:'작성 보류', held:'보류', today:'오늘 신규' }[quick] || '브리프 선별 큐'; }
    async function loadBriefs(preserveSelection){
      const query = currentQuery();
      query.set('view', 'briefs');
      query.set('limit', '100');
      $('list').innerHTML = '<div class="loading">브리프를 불러오는 중입니다.</div>';
      try {
        const response = await CoaAuth.request(`/api/editorial/drafts?${query.toString()}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        briefs = filterQuick(data.briefs || []);
        renderSummary(data.metrics || {});
        renderCollection(data.collection || {});
        renderList();
        const candidate = preserveSelection && selectedId && briefs.some((brief) => brief.id === selectedId) ? selectedId : briefs[0]?.id;
        if (candidate) selectBrief(candidate, false);
        else renderEmptyDetail('조건에 맞는 브리프가 없습니다.');
        syncUrl();
      } catch (error) {
        $('list').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
        renderEmptyDetail('브리프를 불러오지 못했습니다.');
        toast(error.message, true);
      }
    }
    function filterQuick(rows){
      if (quick === 'ready') return rows.filter((brief) => brief.preparation_ready);
      if (quick === 'needs') return rows.filter((brief) => !brief.preparation_ready);
      if (quick === 'held') return rows.filter((brief) => brief.editorial_state === 'held');
      return rows;
    }
    function renderSummary(metrics){
      $('metricReady').textContent = metrics.ready || 0;
      $('metricNeeds').textContent = metrics.needs_verification || 0;
      $('metricHeld').textContent = metrics.held || 0;
      document.querySelectorAll('[data-quick]').forEach((button) => button.classList.toggle('active', button.dataset.quick === quick));
      $('queueTitle').textContent = queueLabel();
      $('queueHint').textContent = quick === 'ready'
        ? '왼쪽에서 가능 여부와 요약으로 고르고, 작성 가능이면 바로 초안으로 넘깁니다.'
        : '선택한 조건의 브리프입니다. 작성 가능으로 돌아가려면 위 카드를 누르세요.';
    }
    function renderCollection(collection){
      const labelText = { normal:'수집 정상', delayed:'수집 지연', stale:'수집 확인 필요' }[collection.status] || '수집 상태 확인 중';
      $('collectionStatus').textContent = labelText;
      $('collectionMeta').textContent = (collection.last_updated_at ? `${relativeTime(collection.last_updated_at)} · ` : '') + '운영 화면';
      $('collectionCard').classList.toggle('ready', collection.status === 'normal');
    }
    function renderList(){
      $('queueCount').textContent = `${briefs.length}건`;
      $('list').innerHTML = briefs.length ? briefs.map((brief) => {
        const system = systemBadge(brief);
        const digest = brief.digest || {};
        return `<button class="item ${selectedId===brief.id?'active':''}" data-id="${brief.id}"><strong>${esc(digest.title || brief.representative_title)}</strong><p class="blurb">${esc(digest.preview || digest.summary || brief.blocker || '요약을 확인할 수 없습니다.')}</p><div class="item-bottom">${badge(system.label,system.kind)}${editorialBadges(brief)}${badge(`공식 ${brief.official_source_count}`,'good')}</div></button>`;
      }).join('') : '<div class="empty">조건에 맞는 브리프가 없습니다.</div>';
      document.querySelectorAll('[data-id]').forEach((element) => element.onclick = () => selectBrief(Number(element.dataset.id), true));
    }
    async function selectBrief(id, updateUrl){
      selectedId = id;
      showAllSources = false;
      renderList();
      $('workspace').classList.add('has-detail');
      $('detail').innerHTML = '<div class="loading">브리프 상세를 불러오는 중입니다.</div>';
      if (updateUrl) syncUrl();
      const requestId = ++loadSequence;
      try {
        const response = await CoaAuth.request(`/api/editorial/drafts?view=brief&id=${id}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        if (requestId !== loadSequence) return;
        selectedBrief = data.brief;
        renderDetail();
      } catch (error) {
        if (requestId !== loadSequence) return;
        renderEmptyDetail(error.message);
        toast(error.message, true);
      }
    }
    function renderDetail(){
      const brief = selectedBrief;
      const validation = brief.validation;
      const digest = brief.digest || {};
      const sources = digest.sources || [];
      const visibleSources = showAllSources ? sources : sources.slice(0, 3);
      const system = systemBadge({ ...brief, preparation_ready: validation.can_prepare, validation_stage: validation.stage });
      const decision = digest.decision || verdictCopy(validation);
      $('detail').innerHTML = `
        <button class="btn secondary mobile-back" id="back" type="button">목록으로</button>
        <div class="eyebrow">${badge(label(brief.category),'blue')}${badge(system.label,system.kind)}${editorialBadges(brief)}<span>공식 출처 ${brief.official_source_count}</span><span>독립 발행처 ${brief.independent_source_count}</span><span>최근 갱신 ${relativeTime(brief.last_seen_at)}</span></div>
        <h2>${esc(digest.title || brief.representative_title)}</h2>
        <div class="verdict ${validation.stage}">
          <h3>${esc(decision.label || verdictCopy(validation).title)}</h3>
          <p class="hint" style="margin:0">${esc(decision.reason || verdictCopy(validation).detail)}</p>
        </div>
        <div class="cta">${primaryActions(brief, validation)}${secondaryActions(brief)}</div>
        <section class="detail-section"><h3>요약</h3><p class="summary">${esc(digest.summary || '요약할 원문이 부족합니다. 근거 제목과 원문을 확인하세요.')}</p></section>
        <section class="detail-section"><h3>핵심</h3>${digestTable(digest.highlights || [])}</section>
        <section class="detail-section"><h3>근거 출처</h3>${visibleSources.map(sourceHtml).join('') || '<p class="muted">근거 기사가 없습니다.</p>'}${sources.length > 3 ? `<button class="btn secondary" id="more" type="button">${showAllSources ? '접기' : `근거 묶음 ${sources.length - 3}개 더 보기`}</button>` : ''}</section>
        <details class="more"><summary>검증 항목·이력 보기</summary>
          ${validationHtml(validation)}
          <section class="detail-section"><h3>수집·검토 이력</h3><div class="history">${brief.history.map(historyHtml).join('')}</div></section>
        </details>`;
      bindDetailActions();
    }
    function verdictCopy(validation){
      if (validation.stage === 'ready') return { title: '작성 가능', detail: '제목·원문·사용 가능한 출처가 확인되어 바로 초안으로 넘길 수 있습니다.' };
      if (validation.stage === 'reviewable') return { title: '작성 보류', detail: validation.warnings[0] || '경고 항목을 원문에서 확인한 뒤 초안을 준비할 수 있습니다.' };
      return { title: '작성 불가', detail: validation.blockers[0] || '필수 검증을 통과해야 초안을 준비할 수 있습니다.' };
    }
    function digestTable(rows){
      if (!rows.length) return '<p class="muted">한눈에 볼 핵심 항목이 없습니다.</p>';
      return `<table class="digest">${rows.map((row) => `<tr><th>${esc(row.label)}</th><td>${esc(row.value)}${row.detail?`<small>${esc(row.detail)}</small>`:''}${row.official?'<small>공식 확인</small>':''}</td></tr>`).join('')}</table>`;
    }
    function sourceHtml(article){
      return `<article class="article"><a href="${esc(article.url)}" target="_blank" rel="noopener"><strong>${esc(article.label || article.title)}</strong></a><div class="article-meta"><span>등급 ${esc(article.source_grade||'D')}</span><span>·</span><span>발행처 ${esc(article.source_domain||'미상')}</span><span>·</span><span>발견 ${esc(article.source||'수집기')}</span>${article.extra_count?`<span>·</span><span>외 ${article.extra_count}건</span>`:''}</div>${article.summary?`<p>${esc(article.summary)}</p>`:''}</article>`;
    }
    function validationHtml(validation){
      const titles = { ready:'기사 준비 검증 통과', reviewable:'검토 후 기사 준비 가능', blocked:'기사 준비 차단' };
      const checks = validation.checklist || [];
      return `<div class="validation ${validation.stage==='blocked'?'blocked':''}"><h3>${titles[validation.stage]||'기사 준비 검증'}</h3><ul class="checks">${checks.map((item)=>`<li class="${item.status==='block'?'fail':item.status}">${esc(item.label)}</li>`).join('')}</ul>${validation.blockers.length||validation.warnings.length?`<ul class="guidance">${[...validation.blockers,...validation.warnings].map((item)=>`<li>${esc(item)}</li>`).join('')}</ul>`:''}</div>`;
    }
    function historyHtml(item){ return `<div><strong>${esc(item.label)}</strong><span>${item.at?formatDate(item.at):'초안 화면에서 계속'}</span></div>`; }
    function primaryActions(brief, validation){
      if (brief.editorial_state === 'prepared' && brief.prepared_draft_id) return `<a class="btn" href="/coanews-draft?draft=${encodeURIComponent(brief.prepared_draft_id)}">기사 초안 열기</a>`;
      if (validation.stage === 'ready') return `<button class="btn" id="prepare" type="button">바로 기사 작성</button>`;
      if (brief.editorial_state === 'unreviewed') return '<button class="btn" id="startReview" type="button">검토 시작</button>';
      if (brief.editorial_state === 'held') return '<button class="btn" id="resumeReview" type="button">검토 재개</button>';
      return `<button class="btn" id="prepare" type="button" ${validation.can_prepare?'':'disabled'}>${validation.stage==='reviewable'?'검토 조건으로 기사 초안 준비':'검증 후 기사 초안 준비'}</button>`;
    }
    function secondaryActions(brief){
      const hold = ['unreviewed', 'reviewing'].includes(brief.editorial_state) ? '<button class="btn secondary" id="hold" type="button">보류</button>' : '';
      return `${hold}<button class="btn secondary" id="copy" type="button">브리프 복사</button><details class="overflow"><summary class="btn secondary">더보기</summary><div><button class="btn secondary danger" id="archive" type="button">보관</button></div></details>`;
    }
    function bindDetailActions(){
      $('back')?.addEventListener('click', () => $('workspace').classList.remove('has-detail'));
      $('more')?.addEventListener('click', () => { showAllSources = !showAllSources; renderDetail(); });
      $('startReview')?.addEventListener('click', () => changeState('start_review'));
      $('hold')?.addEventListener('click', () => changeState('hold'));
      $('resumeReview')?.addEventListener('click', () => changeState('resume'));
      $('archive')?.addEventListener('click', () => changeState('archive'));
      $('copy')?.addEventListener('click', copyBrief);
      $('prepare')?.addEventListener('click', prepareDraft);
    }
    async function changeState(action){
      try {
        const response = await CoaAuth.request('/api/editorial/drafts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, eventClusterId: selectedBrief.id }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '상태를 변경하지 못했습니다.');
        selectedBrief = { ...selectedBrief, ...data.brief };
        toast('검토 상태를 변경했습니다.');
        await loadBriefs(true);
      } catch (error) { toast(error.message, true); }
    }
    async function prepareDraft(){
      const validation = selectedBrief.validation;
      if (!validation.can_prepare) return;
      if (validation.stage !== 'ready' && validation.warnings.length && !confirm(`검토 경고가 ${validation.warnings.length}건 있습니다. 원문을 다시 확인하면서 기사 초안을 준비할까요?`)) return;
      const button = $('prepare');
      button.disabled = true;
      button.textContent = '초안 준비 중';
      try {
        const response = await CoaAuth.request('/api/editorial/drafts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'prepare', eventClusterId: selectedBrief.id }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '기사 초안을 준비하지 못했습니다.');
        localStorage.setItem('coa_news_draft_seed', JSON.stringify(data.seed));
        location.href = `/coanews-draft?draft=${encodeURIComponent(data.draft.id)}`;
      } catch (error) {
        button.disabled = false;
        button.textContent = selectedBrief.validation?.stage === 'ready' ? '바로 기사 작성' : '기사 초안 준비';
        toast(error.message, true);
      }
    }
    async function copyBrief(){
      const brief = selectedBrief;
      const digest = brief.digest || {};
      const text = [
        digest.title || brief.representative_title,
        `분야: ${label(brief.category)}`,
        digest.decision ? `판단: ${digest.decision.label}` : '',
        '',
        '[요약]',
        digest.summary || '',
        '',
        '[핵심]',
        ...(digest.highlights || []).map((row) => `- ${row.label}: ${row.value}`),
        '',
        '[근거]',
        ...(digest.sources || []).map((article) => `- ${article.label || article.title}\n  ${article.url || ''}`),
      ].filter((line, index, lines) => line !== '' || lines[index - 1] !== '').join('\n');
      try { await navigator.clipboard.writeText(text); toast('브리프를 복사했습니다.'); }
      catch (_) { toast('브리프를 복사하지 못했습니다.', true); }
    }
    function applyQuickFilter(){
      if (quick === 'today') { $('freshness').value = '24h'; $('editorialState').value = ''; }
      else if (quick === 'held') { $('freshness').value = 'all'; $('editorialState').value = 'held'; }
      else if (quick === 'ready') { $('freshness').value = '24h'; $('editorialState').value = ''; }
      else if (quick === 'needs') { $('freshness').value = '24h'; $('editorialState').value = ''; }
      loadBriefs(false);
    }
    function renderEmptyDetail(message){ selectedBrief = null; $('detail').innerHTML = `<div class="empty">${esc(message)}</div>`; }
    function systemBadge(brief){
      if (brief.status === 'archived') return { label:'보관', kind:'bad' };
      const decision = brief.digest?.decision;
      if (decision?.label) {
        if (decision.allowed && decision.needs_source_read) return { label: decision.label, kind:'warn' };
        if (decision.allowed) return { label: decision.label, kind:'good' };
        return { label: decision.label, kind: brief.validation_stage === 'blocked' ? 'bad' : 'warn' };
      }
      if (brief.validation_stage === 'ready' || brief.system_status === 'ready') return { label:'작성 가능', kind:'good' };
      if (brief.validation_stage === 'reviewable' || brief.system_status === 'reviewable') return { label:'작성 보류', kind:'warn' };
      if (brief.status === 'developing' && !brief.preparation_ready) return { label:'수집 중', kind:'blue' };
      return { label:'작성 불가', kind:'bad' };
    }
    function editorialBadges(brief){
      if (brief.editorial_state === 'held') return badge('보류','warn');
      if (brief.editorial_state === 'prepared') return badge('초안 전환','blue');
      if (brief.editorial_state === 'reviewing') return badge('검토 중','blue');
      if (brief.digest?.decision?.allowed || brief.validation_stage === 'ready' || brief.system_status === 'ready') return badge('바로 작성','blue');
      return '';
    }
    function badge(text, kind=''){ return `<span class="badge ${kind}">${esc(text)}</span>`; }
    function label(value){ return { ai_business:'AI 비즈니스', startup:'창업·부업', policy:'정책·지원사업', small_business_economy:'소상공인 경제', local_commerce:'지역 상권', marketing_distribution:'마케팅·유통', field_issue:'현장 이슈' }[value] || value; }
    function esc(value){ return String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function relativeTime(value){ const minutes = Math.floor(Math.max(0, Date.now() - Date.parse(value || 0)) / 60000); if (minutes < 60) return `${minutes || 1}분 전`; const hours = Math.floor(minutes / 60); if (hours < 24) return `${hours}시간 전`; const days = Math.floor(hours / 24); return days === 1 ? '어제' : `${days}일 전`; }
    function formatDate(value){ const date = new Date(value); return Number.isNaN(date.getTime()) ? '기록 없음' : date.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    function toast(message, error=false){ const target = $('toast'); target.textContent = message; target.className = `toast ${error?'error':''}`; clearTimeout(toast.timer); toast.timer = setTimeout(() => { target.className = 'toast is-hidden'; }, 2800); }
    function debounce(fn, delay){ let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); }; }
    CoaAuth.requireSession().then((authenticated) => { if (authenticated) loadBriefs(true); });
  </script>
</body>
</html>
