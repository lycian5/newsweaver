<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COA NEWS 리서치 브리프</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#18212a;background:#f4f7f8;--blue:#087ea4;--line:#d8e1e5;--muted:#65747d;--good:#087a43;--warn:#a15c00;--bad:#b42318}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}.top{background:#087ea4;color:#fff;padding:18px 24px}.top-in,.metrics,.filters,.workspace{max-width:1320px;margin-left:auto;margin-right:auto}.top-in{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:21px;margin:0}.top p{font-size:13px;margin:5px 0 0;color:#d9f4fb}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:6px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{background:#fff;color:#24313a;border:1px solid #b9c8cf}.btn.quiet{background:transparent;border:1px solid rgba(255,255,255,.6)}.btn.danger{color:var(--bad);border-color:#fecaca}.btn:disabled{opacity:.5;cursor:not-allowed}.collection{padding:7px 9px;border-radius:99px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700}.collection.delayed{background:#895b0f}.collection.stale{background:#9e2620}.account{position:relative}.account summary{list-style:none;border:1px solid rgba(255,255,255,.6);padding:9px 11px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}.account summary::-webkit-details-marker{display:none}.account div{position:absolute;right:0;top:43px;z-index:5;background:#fff;padding:8px;border:1px solid var(--line);border-radius:7px}.metrics{padding:16px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left}.metric strong{display:block;color:var(--blue);font-size:22px}.metric span{font-size:12px;color:var(--muted)}.filters{padding:12px 16px 0;display:grid;grid-template-columns:1.4fr repeat(5,.7fr);gap:9px}.filters input,.filters select{border:1px solid #b9c8cf;border-radius:6px;padding:10px;background:#fff}.workspace{padding:16px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;min-width:0}.queue-head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.queue-head h2,.detail h2{margin:0}.queue-head span,.muted,.item-meta,.article-meta,.history{color:var(--muted);font-size:12px}.list{min-height:520px;max-height:calc(100vh - 270px);overflow:auto}.item{display:block;width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:14px;text-align:left}.item.active,.item:hover{background:#edf8fb}.item strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.42}.item-meta,.item-bottom,.eyebrow,.article-meta,.history,.actionbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.item-meta{margin-top:7px}.item-bottom{margin-top:8px}.badge{display:inline-flex;font-size:11px;padding:3px 7px;border-radius:4px;background:#edf2f4}.badge.good{background:#e8f6ee;color:var(--good)}.badge.warn{background:#fff4dc;color:var(--warn)}.badge.bad{background:#fff0ee;color:var(--bad)}.badge.blue{background:#e5f4f9;color:#075f7d}.detail{padding:24px;min-height:620px}.detail h2{font-size:24px;line-height:1.38;margin:8px 0 10px}.detail-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.detail-section h3{font-size:15px;margin:0 0 10px}.judgment{display:grid;gap:8px;line-height:1.55;font-size:14px}.validation{border:1px solid #bae6fd;background:#f0f9ff;border-radius:7px;padding:13px}.validation.blocked{border-color:#fecaca;background:#fff6f5}.checks{padding:0;margin:0;list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.checks li{font-size:12px}.checks li::before{content:'●';margin-right:6px}.pass::before{color:var(--good)}.warn::before{color:#d88900}.fail::before{color:var(--bad)}.guidance{font-size:12px;color:var(--warn);margin:11px 0 0}.fact-group{border:1px solid #e5edf0;border-radius:7px;padding:11px;margin-top:9px}.fact-group h4{color:#075f7d;font-size:12px;margin:0 0 7px}.fact{font-size:13px;padding:8px 0;border-top:1px solid #edf1f2}.fact:first-of-type{border-top:0}.fact small{margin-left:5px;color:var(--muted)}.article{padding:13px 0;border-top:1px solid #edf1f2}.article:first-child{border-top:0}.article a{color:#12688a;text-decoration:none}.article p{font-size:13px;color:#4e5d66;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.history{gap:18px}.history strong{display:block;color:#24313a;margin-bottom:3px}.actionbar{position:sticky;bottom:10px;justify-content:space-between;padding:14px 0 0;margin-top:22px;border-top:1px solid var(--line)}.actionbar>div{display:flex;gap:8px;flex-wrap:wrap}.overflow{position:relative}.overflow summary{list-style:none}.overflow summary::-webkit-details-marker{display:none}.overflow>div{position:absolute;right:0;bottom:42px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:7px}.empty,.loading{padding:48px 20px;text-align:center;color:var(--muted)}.mobile-back{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:9;background:#18212a;color:#fff;padding:11px 14px;border-radius:7px}.toast.error{background:var(--bad)}.is-hidden{display:none}@media(max-width:980px){.filters{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:300px minmax(0,1fr)}}@media(max-width:700px){.top{padding:16px}.top-in{display:block}.top-actions{margin-top:12px;justify-content:space-between}.metrics{grid-template-columns:repeat(2,1fr);padding:12px 12px 0}.filters{padding:12px 12px 0;grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.workspace{display:block;padding:12px}.detail-panel{display:none}.workspace.has-detail .queue-panel{display:none}.workspace.has-detail .detail-panel{display:block}.list{max-height:none;min-height:480px}.detail{padding:18px}.mobile-back{display:inline-flex;margin-bottom:13px}.detail h2{font-size:20px}.checks{grid-template-columns:1fr}.actionbar{margin-left:0;margin-right:0}.actionbar .left{display:none}.actionbar .right{width:100%}.actionbar .right .btn{flex:1}}
  </style>
</head>
<body>
  <header class="top"><div class="top-in"><div><h1>COA NEWS 리서치 브리프</h1><p>수집된 근거를 빠르게 선별하고 검증한 뒤 기사 초안으로 넘깁니다.</p></div><div class="top-actions"><span class="collection" id="collectionStatus">수집 상태 확인 중</span><button class="btn quiet" id="refresh" type="button">새로고침</button><details class="account"><summary>관리자</summary><div><button class="btn secondary" id="logout" type="button">로그아웃</button></div></details></div></div></header>
  <section class="metrics"><button class="metric" data-quick="today"><strong id="metricNew">0</strong><span>오늘 신규</span></button><button class="metric" data-quick="ready"><strong id="metricReady">0</strong><span>작성 가능</span></button><button class="metric" data-quick="needs"><strong id="metricNeeds">0</strong><span>검증 필요</span></button><button class="metric" data-quick="held"><strong id="metricHeld">0</strong><span>보류</span></button></section>
  <section class="filters"><input id="search" type="search" placeholder="제목 검색" autocomplete="off" /><select id="category"><option value="">전체 분야</option><option value="ai_business">AI 비즈니스</option><option value="startup">창업·부업</option><option value="policy">정책·지원사업</option></select><select id="freshness"><option value="24h">최근 24시간</option><option value="7d">최근 7일</option><option value="30d">최근 30일</option><option value="all">전체 기간</option></select><select id="sourceLayer"><option value="">전체 출처</option><option value="official">공식 출처 포함</option><option value="data">데이터 출처 포함</option><option value="signal">신호 출처 포함</option></select><select id="editorialState"><option value="unreviewed">미검토</option><option value="reviewing">검토 중</option><option value="held">보류</option><option value="prepared">초안 전환</option><option value="">전체 상태</option></select><select id="sort"><option value="attention">선별 우선</option><option value="latest">최신순</option><option value="quality">품질순</option><option value="official">공식 출처순</option></select></section>
  <main class="workspace" id="workspace"><section class="panel queue-panel"><div class="queue-head"><h2>브리프 선별 큐</h2><span id="queueCount">0건</span></div><div class="list" id="list"><div class="loading">브리프를 불러오는 중입니다.</div></div></section><section class="panel detail-panel" id="detail"><div class="empty">왼쪽에서 브리프를 선택하세요.</div></section></main>
  <div class="toast is-hidden" id="toast" role="status"></div>
  <script src="/auth-session.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const filters = ['search','category','freshness','sourceLayer','editorialState','sort'];
    let briefs = [], selectedId = null, selectedBrief = null, showAllSources = false, loadSequence = 0, quick = '';
    restoreFilters();
    $('refresh').onclick = () => loadBriefs(true);
    $('logout').onclick = CoaAuth.logout;
    filters.forEach((id) => $(id).addEventListener(id === 'search' ? 'input' : 'change', debounce(() => loadBriefs(false), id === 'search' ? 250 : 0)));
    document.querySelectorAll('[data-quick]').forEach((button) => button.onclick = () => { quick = button.dataset.quick; applyQuickFilter(); });
    function restoreFilters(){const query=new URLSearchParams(location.search),defaults={freshness:'24h',editorialState:'unreviewed',sort:'attention'};filters.forEach((id)=>{$(id).value=query.get(id)??defaults[id]??''});selectedId=Number(query.get('id'))||null;quick=query.get('quick')||''}
    function currentQuery(){const query=new URLSearchParams();filters.forEach((id)=>{if($(id).value)query.set(id,$(id).value)});if(quick)query.set('quick',quick);if(selectedId)query.set('id',selectedId);return query}
    function syncUrl(){history.replaceState(null,'',`${location.pathname}?${currentQuery().toString()}`)}
    async function loadBriefs(preserveSelection){const query=currentQuery();query.set('view','briefs');query.set('limit','100');$('list').innerHTML='<div class="loading">브리프를 불러오는 중입니다.</div>';try{const response=await CoaAuth.request(`/api/editorial/drafts?${query.toString()}`),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);briefs=filterQuick(data.briefs||[]);renderSummary(data.metrics||{});renderCollection(data.collection||{});renderList();const candidate=preserveSelection&&selectedId&&briefs.some((brief)=>brief.id===selectedId)?selectedId:briefs[0]?.id;if(candidate)selectBrief(candidate,false);else renderEmptyDetail('조건에 맞는 브리프가 없습니다.');syncUrl()}catch(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;renderEmptyDetail('브리프를 불러오지 못했습니다.');toast(error.message,true)}}
    function filterQuick(rows){if(quick==='ready')return rows.filter((brief)=>brief.preparation_ready);if(quick==='needs')return rows.filter((brief)=>!brief.preparation_ready);if(quick==='held')return rows.filter((brief)=>brief.editorial_state==='held');return rows}
    function renderSummary(metrics){$('metricNew').textContent=metrics.new_today||0;$('metricReady').textContent=metrics.ready||0;$('metricNeeds').textContent=metrics.needs_verification||0;$('metricHeld').textContent=metrics.held||0}
    function renderCollection(collection){const label={normal:'수집 정상',delayed:'수집 지연',stale:'수집 확인 필요'}[collection.status]||'수집 상태 확인 중';$('collectionStatus').textContent=label+(collection.last_updated_at?` · ${relativeTime(collection.last_updated_at)}`:'');$('collectionStatus').className=`collection ${collection.status||''}`}
    function renderList(){$('queueCount').textContent=`${briefs.length}건`;$('list').innerHTML=briefs.length?briefs.map((brief)=>{const system=systemBadge(brief);return `<button class="item ${selectedId===brief.id?'active':''}" data-id="${brief.id}"><strong>${esc(brief.representative_title)}</strong><div class="item-meta"><span>${label(brief.category)}</span><span>·</span><span>${relativeTime(brief.last_seen_at)}</span></div><div class="item-bottom">${badge(system.label,system.kind)}${badge(editorialLabel(brief.editorial_state),brief.editorial_state==='held'?'warn':'blue')}${badge(`공식 ${brief.official_source_count}`,'good')}${badge(`독립 ${brief.independent_source_count}`)}${badge(`수치 ${brief.numeric_fact_count}`)}</div>${brief.blocker?`<div class="item-meta">${esc(brief.blocker)}</div>`:''}</button>`}).join(''):'<div class="empty">조건에 맞는 브리프가 없습니다.</div>';document.querySelectorAll('[data-id]').forEach((element)=>element.onclick=()=>selectBrief(Number(element.dataset.id),true))}
    async function selectBrief(id,updateUrl){selectedId=id;showAllSources=false;renderList();$('workspace').classList.add('has-detail');$('detail').innerHTML='<div class="loading">브리프 상세를 불러오는 중입니다.</div>';if(updateUrl)syncUrl();const requestId=++loadSequence;try{const response=await CoaAuth.request(`/api/editorial/drafts?view=brief&id=${id}`),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);if(requestId!==loadSequence)return;selectedBrief=data.brief;renderDetail()}catch(error){if(requestId!==loadSequence)return;renderEmptyDetail(error.message);toast(error.message,true)}}
    function renderDetail(){const brief=selectedBrief,validation=brief.validation,articles=showAllSources?brief.articles:brief.articles.slice(0,3),system=systemBadge({...brief,preparation_ready:validation.ready});$('detail').innerHTML=`<button class="btn secondary mobile-back" id="back" type="button">목록으로</button><div class="eyebrow">${badge(label(brief.category),'blue')}${badge(system.label,system.kind)}${badge(editorialLabel(brief.editorial_state),brief.editorial_state==='held'?'warn':'blue')}<span>최근 갱신 ${relativeTime(brief.last_seen_at)}</span></div><h2>${esc(brief.representative_title)}</h2><div class="eyebrow"><span>공식 출처 ${brief.official_source_count}</span><span>·</span><span>독립 발행처 ${brief.independent_source_count}</span><span>·</span><span>근거 기사 ${brief.articles.length}</span></div><section class="detail-section"><h3>핵심 판단</h3><ul class="judgment">${judgment(brief)}</ul></section><section class="detail-section">${validationHtml(validation)}</section><section class="detail-section"><h3>확인된 사실</h3>${factsHtml(groupFacts(brief.facts||[]))}</section><section class="detail-section"><h3>근거 출처</h3>${articles.map(articleHtml).join('')||'<p class="muted">근거 기사가 없습니다.</p>'}${brief.articles.length>3?`<button class="btn secondary" id="more" type="button">${showAllSources?'접기':`근거 출처 ${brief.articles.length-3}건 더 보기`}</button>`:''}</section><section class="detail-section"><h3>수집·검토 이력</h3><div class="history">${brief.history.map(historyHtml).join('')}</div></section><div class="actionbar"><div>${secondaryActions(brief)}</div><div>${primaryActions(brief,validation)}</div></div>`;bindDetailActions()}
    function validationHtml(validation){const checks=[[validation.checks.title,'대표 제목',true],[validation.checks.evidence,'근거 기사',true],[validation.checks.source_url,'원문 URL',true],[validation.checks.verified_source,'공식 또는 검증 출처',true],[validation.checks.independent_sources,'독립 발행처 2곳',!validation.is_policy],[validation.checks.key_facts,validation.is_policy?'공식 원문·발행일':'날짜·기관·수치 사실',false],[validation.checks.fresh,'최근 24시간 갱신',false]];return `<div class="validation ${validation.ready?'':'blocked'}"><h3>${validation.ready?'기사 준비 검증 통과':'기사 준비 검증 필요'}</h3><ul class="checks">${checks.map(([pass,text,critical])=>`<li class="${pass?'pass':critical?'fail':'warn'}">${text}</li>`).join('')}</ul>${validation.blockers.length||validation.warnings.length?`<ul class="guidance">${[...validation.blockers,...validation.warnings].map((item)=>`<li>${esc(item)}</li>`).join('')}</ul>`:''}</div>`}
    function judgment(brief){const items=(brief.facts||[]).slice(0,3).map((fact)=>`<li>${esc(fact.fact_text)}</li>`);if(!items.length&&brief.articles?.[0]?.summary)items.push(`<li>${esc(brief.articles[0].summary)}</li>`);if(!items.length)items.push('<li>근거 기사 원문에서 핵심 사실을 먼저 확인하세요.</li>');if(!brief.validation.ready)items.push(`<li><strong>검증 우선:</strong> ${esc(brief.validation.blockers[0]||'검증 항목을 확인하세요.')}</li>`);return items.join('')}
    function groupFacts(facts){const labels={date:'날짜',number:'수치',organization:'기관',person:'인물',quote:'인용',claim:'주장',location:'장소'};return facts.reduce((groups,fact)=>{const key=labels[fact.fact_type]||'기타';(groups[key]||=[]).push(fact);return groups},{})}
    function factsHtml(groups){const entries=Object.entries(groups);if(!entries.length)return '<p class="muted">추출된 사실이 없습니다.</p>';return entries.map(([type,facts])=>`<section class="fact-group"><h4>${type}</h4>${facts.map((fact)=>`<div class="fact">${esc(fact.fact_text)} ${fact.source_url?`<a href="${esc(fact.source_url)}" target="_blank" rel="noopener">근거</a>`:''}<small>${fact.is_official?'공식 확인':`신뢰도 ${Math.round(Number(fact.confidence||0)*100)}%`}</small></div>`).join('')}</section>`).join('')}
    function articleHtml(article){return `<article class="article"><a href="${esc(article.url)}" target="_blank" rel="noopener"><strong>${esc(article.title)}</strong></a><div class="article-meta"><span>발행처 ${esc(article.source_domain||'미상')}</span><span>·</span><span>발견 ${esc(article.source||'수집기')}</span><span>·</span><span>품질 ${article.quality_score||0}</span><span>·</span><span>${esc(article.verification_status||'미확인')}</span></div>${article.summary?`<p>${esc(article.summary)}</p>`:''}</article>`}
    function historyHtml(item){return `<div><strong>${esc(item.label)}</strong><span>${item.at?formatDate(item.at):'초안 화면에서 계속'}</span></div>`}
    function primaryActions(brief,validation){if(brief.editorial_state==='prepared'&&brief.prepared_draft_id)return `<a class="btn" href="/coanews-draft?draft=${encodeURIComponent(brief.prepared_draft_id)}">기사 초안 열기</a>`;if(brief.editorial_state==='unreviewed')return '<button class="btn" id="startReview" type="button">검토 시작</button>';if(brief.editorial_state==='held')return '<button class="btn" id="resumeReview" type="button">검토 재개</button>';return `<button class="btn" id="prepare" type="button" ${validation.ready?'':'disabled'}>검증 후 기사 초안 준비</button>`}
    function secondaryActions(brief){const hold=brief.editorial_state==='reviewing'?'<button class="btn secondary" id="hold" type="button">보류</button>':'';return `${hold}<button class="btn secondary" id="copy" type="button">브리프 복사</button><details class="overflow"><summary class="btn secondary">더보기</summary><div><button class="btn secondary danger" id="archive" type="button">보관</button></div></details>`}
    function bindDetailActions(){$('back')?.addEventListener('click',()=>$('workspace').classList.remove('has-detail'));$('more')?.addEventListener('click',()=>{showAllSources=!showAllSources;renderDetail()});$('startReview')?.addEventListener('click',()=>changeState('start_review'));$('hold')?.addEventListener('click',()=>changeState('hold'));$('resumeReview')?.addEventListener('click',()=>changeState('resume'));$('archive')?.addEventListener('click',()=>changeState('archive'));$('copy')?.addEventListener('click',copyBrief);$('prepare')?.addEventListener('click',prepareDraft)}
    async function changeState(action){try{const response=await CoaAuth.request('/api/editorial/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,eventClusterId:selectedBrief.id})}),data=await response.json();if(!response.ok)throw new Error(data.error||'상태를 변경하지 못했습니다.');selectedBrief={...selectedBrief,...data.brief};toast('검토 상태를 변경했습니다.');await loadBriefs(true)}catch(error){toast(error.message,true)}}
    async function prepareDraft(){const validation=selectedBrief.validation;if(!validation.ready)return;if(validation.warnings.length&&!confirm(`검토 경고가 ${validation.warnings.length}건 있습니다. 원문을 다시 확인하면서 기사 초안을 준비할까요?`))return;const button=$('prepare');button.disabled=true;button.textContent='초안 준비 중';try{const response=await CoaAuth.request('/api/editorial/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'prepare',eventClusterId:selectedBrief.id})}),data=await response.json();if(!response.ok)throw new Error(data.error||'기사 초안을 준비하지 못했습니다.');localStorage.setItem('coa_news_draft_seed',JSON.stringify(data.seed));location.href=`/coanews-draft?draft=${encodeURIComponent(data.draft.id)}`}catch(error){button.disabled=false;button.textContent='검증 후 기사 초안 준비';toast(error.message,true)}}
    async function copyBrief(){const brief=selectedBrief,text=[brief.representative_title,`분야: ${label(brief.category)}`,'','[확인된 사실]',...(brief.facts||[]).map((fact)=>`- ${fact.fact_text}`),'','[근거 기사]',...(brief.articles||[]).map((article)=>`- ${article.title}\n  ${article.url}`)].join('\n');try{await navigator.clipboard.writeText(text);toast('브리프를 복사했습니다.')}catch(_){toast('브리프를 복사하지 못했습니다.',true)}}
    function applyQuickFilter(){if(quick==='today'){$('freshness').value='24h';$('editorialState').value=''}else if(quick==='held'){$('freshness').value='all';$('editorialState').value='held'}else if(quick==='ready'){$('freshness').value='all';$('editorialState').value=''}else if(quick==='needs'){$('freshness').value='24h';$('editorialState').value=''}loadBriefs(false)}
    function renderEmptyDetail(message){selectedBrief=null;$('detail').innerHTML=`<div class="empty">${esc(message)}</div>`}
    function systemBadge(brief){if(brief.status==='archived')return{label:'보관',kind:'bad'};if(brief.preparation_ready)return{label:'작성 가능',kind:'good'};if(brief.status==='developing')return{label:'수집 중',kind:'blue'};return{label:'검증 필요',kind:'warn'}}
    function editorialLabel(value){return{unreviewed:'미검토',reviewing:'검토 중',held:'보류',prepared:'초안 전환'}[value]||'미검토'}
    function badge(text,kind=''){return `<span class="badge ${kind}">${esc(text)}</span>`}
    function label(value){return{ai_business:'AI 비즈니스',startup:'창업·부업',policy:'정책·지원사업'}[value]||value}
    function esc(value){return String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function relativeTime(value){const minutes=Math.floor(Math.max(0,Date.now()-Date.parse(value||0))/60000);if(minutes<60)return `${minutes||1}분 전`;const hours=Math.floor(minutes/60);if(hours<24)return `${hours}시간 전`;const days=Math.floor(hours/24);return days===1?'어제':`${days}일 전`}
    function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'기록 없음':date.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
    function toast(message,error=false){const target=$('toast');target.textContent=message;target.className=`toast ${error?'error':''}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{target.className='toast is-hidden'},2800)}
    function debounce(fn,delay){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay)}}
    CoaAuth.requireSession().then((authenticated)=>{if(authenticated)loadBriefs(true)});
  </script>
